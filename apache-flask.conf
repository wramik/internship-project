<VirtualHost *:80>
    ServerName localhost

    WSGIDaemonProcess video_service python-path=/app
    WSGIProcessGroup video_service
    WSGIScriptAlias / /app/app.wsgi

    <Directory /app>
        <Files app.wsgi>
            Require all granted
        </Files>
    </Directory>

    Timeout 300
    ErrorLog ${APACHE_LOG_DIR}/video_service_error.log
    CustomLog ${APACHE_LOG_DIR}/video_service_access.log combined
    LogLevel warn
</VirtualHost>
